version: '3'

tasks:
  build:
    desc: Build the landsraad binary
    cmds:
      - go build -o bin/landsraad ./cmd/landsraad

  test:
    desc: Run all tests under the race detector
    cmds:
      # -race, not a bare `go test`. TestGitHubConcurrentRefAccess and
      # TestGitLabConcurrentRefAccess assert only that two concurrent calls
      # return nil errors, which a racy resolveRef satisfies perfectly:
      # deleting every g.mu call from GitHub.resolveRef passes `go test
      # -count=20` twenty times out of twenty and fails under -race on the
      # first run. Those two tests exist to protect against a bug an earlier
      # review found, and without this flag this project's own gate could not
      # see it.
      - go test -race ./...

  lint:
    desc: Vet, check formatting, and enforce the rules CONTRIBUTING.md states
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # Go 1.23+. Exits non-zero, changing nothing, when go.mod or go.sum is
      # untidy — which is how every direct dependency came to be marked
      # "// indirect".
      - go mod tidy -diff
      - sh scripts/check-rules.sh

  release:
    desc: Build tagged, checksummed binaries for every platform
    cmds:
      - goreleaser release --clean

  install:
    desc: Build and symlink the lsr alias alongside the binary
    deps: [build]
    cmds:
      - ln -sf landsraad bin/lsr

  schema:
    desc: Export the JSON Schemas to schema/ for editor autocompletion
    cmds:
      - mkdir -p schema
      - go run ./cmd/landsraad schema > schema/service.schema.json
      - go run ./cmd/landsraad schema --kind standards > schema/standards.schema.json

  site:
    desc: Build the portal from the fixture repository and open it
    cmds:
      - go run ./cmd/landsraad build testdata/monorepo-ok -o dist
      - echo "built dist/ — run 'go run ./cmd/landsraad serve testdata/monorepo-ok --watch' to preview"

  site-multirepo:
    desc: Build the portal from the multi-repo fixture, with the remote faked
    cmds:
      - go test ./cmd/landsraad/ -run TestBuildMergesALocalAndARemoteRepository -v

  ci:
    desc: Everything CI runs
    deps: [lint, test]

  default:
    cmds:
      - task: ci
